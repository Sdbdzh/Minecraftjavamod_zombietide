name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明「你遇到什么问题」，而不是直接给方案 —— 这样更容易找到更合适的做法。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 使用场景是什么？现在哪里不舒服？
      placeholder: 例如：把间隔设成 7 天后，HUD 上看不出下次是哪天
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充说明
    validations:
      required: false
