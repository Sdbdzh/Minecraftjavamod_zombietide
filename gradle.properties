org.gradle.jvmargs=-Xmx2G

# 注意：不要在这里写 org.gradle.java.home（那是本机路径，会让别人 clone 后构建失败）。
# 构建需要 JDK 21；请通过 JAVA_HOME 环境变量，或在「用户级」~/.gradle/gradle.properties 里配置：
#   org.gradle.java.home=C:/path/to/jdk-21

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.265

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Mod metadata（mod_id 与 @Mod 注解必须一致）
# mod_version 是**唯一版本源**：neoforge.mods.toml 的 version、jar 文件名、设置页左下角
# 显示的「版本号」都由它派生。改这里即可，不要手改其他地方。
# 必须与「版本历史.md」最新条目的主干号一致（v0.2.140-jump-progress-fix → 0.2.140）。
mod_id=enik_zombietide
mod_name=Zombie Tide
mod_version=0.2.140
mod_group_id=com.enik.zombietide
mod_authors=Enik
mod_license=Apache-2.0
mod_description=Zombie Tide NeoForge mod - a periodic horde system inspired by 7 Days to Die
