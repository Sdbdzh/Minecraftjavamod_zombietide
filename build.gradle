plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Only expand placeholders in neoforge.mods.toml; other resource files are copied as-is.
// Note: expand is backed by the Groovy template engine, which treats any
// "dollar+brace" snippet it sees as an expression — writing such example text
// (non-placeholder) in resource files will fail the build with a template parse error.
// Chinese in gradle.properties must be written as Unicode escapes (\uXXXX) to avoid
// garbled output from the ISO-8859-1 properties file encoding.
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

// Ensure Java compilation and resource processing use UTF-8
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

compileJava.options.encoding = 'UTF-8'

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
