plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def isWindowsHost = System.getProperty('os.name').toLowerCase().contains('windows')

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (isWindowsHost) {
                jvmArgument '-Dstdout.encoding=GBK'
                jvmArgument '-Dstderr.encoding=GBK'
            }
        }
        server {
            server()
            programArgument '--nogui'
            if (isWindowsHost) {
                jvmArgument '-Dstdout.encoding=GBK'
                jvmArgument '-Dstderr.encoding=GBK'
            }
        }
        data {
            data()
            if (isWindowsHost) {
                jvmArgument '-Dstdout.encoding=GBK'
                jvmArgument '-Dstderr.encoding=GBK'
            }
        }
    }
    // 控制台中文乱码：JVM 默认按 UTF-8 输出，而 Windows 控制台是 GBK(CP936)，
    // 于是「玩家 sdbdzh 进入世界」会变成「鐜╁ sdbdzh 杩涘叆涓栫晫」。
    // 这里让 stdout/stderr 按平台默认编码输出（日志文件仍是 UTF-8，不受影响）。

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Only expand placeholders in neoforge.mods.toml; other resource files are copied as-is.
// Note: expand is backed by the Groovy template engine, which treats any
// "dollar+brace" snippet it sees as an expression — writing such example text
// (non-placeholder) in resource files will fail the build with a template parse error.
// Chinese in gradle.properties must be written as Unicode escapes (\uXXXX) to avoid
// garbled output from the ISO-8859-1 properties file encoding.
processResources {
    // 把 neoforge.mods.toml 里用到的占位符属性显式声明为任务输入。
    // 否则只改 gradle.properties 时，Gradle 会认为源文件没变而判定 UP-TO-DATE，
    // 打出来的 jar 里 version 仍是旧值（踩过一次：改 mod_version 后 jar 内还是 0.1.0）。
    inputs.property('mod_id', mod_id)
    inputs.property('mod_name', mod_name)
    inputs.property('mod_version', mod_version)
    inputs.property('mod_authors', mod_authors)
    inputs.property('mod_license', mod_license)
    inputs.property('mod_description', mod_description)
    inputs.property('neo_version_range', neo_version_range)
    inputs.property('minecraft_version_range', minecraft_version_range)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

// Ensure Java compilation and resource processing use UTF-8
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

compileJava.options.encoding = 'UTF-8'

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// runServer 默认不转发控制台输入，导致无法在终端敲 op/stop 等命令。
// 必须放在 neoForge 块外：runs{} 里的任务在块内尚未注册，named() 会找不到。
tasks.named('runServer').configure {
    if (it instanceof JavaExec) {
        it.standardInput = System.in
    }
}
